
name: CI - build and test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Generate reports
        run: ./gradlew reports

      - name: Create website homepage
        run: |
          cat > build/reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>CS350 Reports</title>
          </head>
          <body>
            <h1>CS350 Project Reports</h1>
            <ul>
              <li><a href="tests/test/index.html">JUnit Test Reports</a></li>
              <li><a href="javadoc/index.html">Javadoc</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/reports
